# PHASE 6 — SCUT PRETRAINING: ViT-B/16 ON ORIGINAL (UNMASKED) SCUT.
#
# One of THIRTY pretraining configs, and the one that carries the shared
# reasoning. Transformers form a 2x3 lattice (backbone x source at
# region_scheme none); graph backbones a 2x4x3 lattice (backbone x
# region_scheme x source) [DECIDED 2026-07-31 -- the scheme became a
# pretraining axis because the graph layers must see the same node structure
# in pretraining and cleft fine-tuning]. Within each block every config
# differs from its lattice neighbours in EXACTLY ONE task field, asserted by
# tests/test_pretrain.py. Everything below the axis fields is identical
# across all thirty on purpose: a hyperparameter tuned per backbone would
# confound the init ladder's backbone comparison with tuning effort.
#
# ----------------------------------------------------------------------------
# WHAT THIS RUN IS
# ----------------------------------------------------------------------------
# Full fine-tuning -- every parameter trains, asserted at reset -- on the
# official 3300/2200 SCUT split, regression on the dataset's own 1-5 label,
# MSE. CM152 is excluded (empty landmark file; TEST side, so training is
# untouched at 3,300 and test is 2,199). The split is READ, never generated:
# the split files carry the label, so it is one read rather than a join.
#
# Inner validation (10%) is carved from the TRAIN side by the frozen
# harness.inner_val_split; the kept checkpoint is the best inner_val_pcc
# epoch within the FIXED budget (no early stopping -- see the epochs field);
# the TEST side is touched exactly once, by the restored best weights.
# Selecting on test would make the band check unreadable.
#
# ----------------------------------------------------------------------------
# THE NUMBER THIS RUN MUST PRODUCE [LITERATURE, brief §3.1]
# ----------------------------------------------------------------------------
# metrics.json records the SCUT test correlation and a band_check verdict.
# Published band ~0.88-0.93 (ResNeXt-50 ~0.90, label-distribution ~0.95,
# hybrids ~0.926). An ORIGINAL run below 0.85 means pretraining FAILED and
# `checkpoint_consumable: false` -- nothing downstream may consume it.
#
# ----------------------------------------------------------------------------
# CHECKPOINTING [the Phase 6 entry gate, verified]
# ----------------------------------------------------------------------------
# checkpoint.npz in the run directory every epoch; a Run:AI pause reattaches
# the directory via JOB_UUID and the loop resumes byte-identically instead of
# silently restarting at epoch 0 (PLAN §2.7). The deliverable is
# pretrained.npz -- the best weights in the same verified format, with the
# test correlation and band verdict inside its header.
#
# ----------------------------------------------------------------------------
# HYPERPARAMETERS [DECIDED 2026-07-31, identical across all thirty]
# ----------------------------------------------------------------------------
#   learning_rate 1e-4   full-fine-tune scale (1e-3 is the frozen-HEAD rate;
#                        at full fine-tuning it destroyed the representation)
#   weight_decay 0.01    project default, AdamW
#   batch_size 32        ~93 optimizer steps per epoch over 2,970 fit faces
#   epochs 30            the FIXED budget, every arm exactly N [DECIDED
#                        2026-07-31 -- see the epochs field's comment]
#   inner_val_frac 0.1   330 faces held out; 0.2 would cost 330 more train
#                        faces for an estimate this size does not need
#   checkpoint_every 1   epoch granularity -- see train/pretrain.py for why
#                        the epoch is the durable unit
#
# If a backbone cannot reach the band at these shared values, that is a
# finding to record and a deliberate, documented deviation -- not a quiet
# per-arm retune.
#
# ----------------------------------------------------------------------------
# THE PATH COMES FROM THE ENVIRONMENT
# ----------------------------------------------------------------------------
# Set CLEFT_SCUT_ROOT to the SCUT-FBP5500_v2 directory on this machine:
#
#     cluster : export CLEFT_SCUT_ROOT=/home/user/codex/scut/SCUT-FBP5500_v2
#     laptop  : $env:CLEFT_SCUT_ROOT = "C:\data\scut-fbp5500\SCUT-FBP5500_v2"
#
# The declared rollup verifies whatever was resolved (guard 3). The two copies
# are byte-identical (Phase 5 exit criterion 9), so one declared hash is
# checkable on both machines.
#
#   bash -lc "cd /home/user/codex/cleft-aesthetics && PYTHONPATH=src \
#     python -m cleft.run --config configs/p6_pretrain_vit_b16_original.yaml"

schema_version: 1
phase: p6
tier: keeper
seed: 1337

inputs:
  - name: scut_root
    path: ${CLEFT_SCUT_ROOT}
    rollup_sha256: 1041ceed0ef458e97c8be845eda30cf7957067fa730a4975a0f83bd8ed4947ec

task:
  kind: pretrain

  scut_root: scut_root

  # The lattice axes. Everything else is shared across all thirty.
  backbone: vit_b16
  source: original
  # Transformers have no region structure; the scheme axis is the
  # graph backbones' [DECIDED 2026-07-31]. The loop refuses any
  # other value here -- a knob that cannot act records an arm that
  # never ran.
  region_scheme: none

  # The official split after CM152 exclusion; the run refuses a disagreement.
  expect_train: 3300
  expect_test: 2199

  # [DECIDED 2026-07-31] FIXED 30-epoch budget, best-checkpoint selection by
  # inner_val_pcc -- NO early stopping, and deliberately no patience field.
  # The four SR-GNN scheme originals showed patience terminating on noise in
  # a flat MSE region (anatomy epochs 5 vs 7: 2.3e-5 apart): run length
  # tracked luck, not scheme, and none of the eight pre-policy runs had
  # converged -- inner-val PCC was still climbing at every stopping point.
  # The replay over all eight curves showed a monitor switch only moves where
  # the noise bites. A fixed budget makes the arms comparable BY CONSTRUCTION
  # and the cost knowable in advance; those eight runs are SUPERSEDED (kept,
  # not deleted -- their curves are the evidence for this decision).
  #
  # This does NOT contradict Phase 3 gate 4: the void ladder's fixed budget
  # measured post-collapse endpoints on 152 cleft samples (peaks at epochs
  # 2-11, decay to ~0 in 20/20 fold-runs); on SCUT's 3,300 there is no
  # collapse -- PCC climbs monotonically in all eight curves. Early stopping
  # STAYS for the cleft ladder, where collapse is the documented behaviour.
  # N=30 covers every observed run except SR-GNN original's 34, and PCC has
  # largely plateaued by then. Selection on inner_val_pcc matches the primary
  # metric; legitimate because inner-val is carved from the TRAIN side and
  # the test set is disjoint, touched once.
  epochs: 30
  inner_val_frac: 0.1
  monitor: inner_val_pcc

  # [DECIDED 2026-07-31, from image measurements] FALSE, and settled: flag-off
  # in the image, vit_b16/swin_b/srgnn are BITWISE (repeat-grad and post-
  # restore step 0.0) so the flag buys them nothing -- and it CANNOT fix
  # agnet there: the deterministic roi_align substitution needs
  # torch.compile -> inductor -> a C++ compiler the image does not have
  # (InvalidCxxCompiler, measured). AG-Net's recorded property instead:
  # deterministic to ~2.3e-05 (post-restore 2.26e-05 image / 2.31e-05 local),
  # its resume check is a tolerance, and any AG-Net delta needs its own seed
  # band measured under that condition. models/{agnet,srgnn}.py
  # TRAINING_DETERMINISM carry the full record; if this is ever set true, the
  # loop routes through the frozen determinism.configure (CUBLAS workspace).
  deterministic: false

  learning_rate: 0.0001
  weight_decay: 0.01
  batch_size: 32

  checkpoint_every: 1
