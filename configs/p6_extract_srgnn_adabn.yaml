# PHASE 6 — PER-FOLD BN RE-EXTRACTION OF THE SR-GNN FEATURE MAPS.
#
# ----------------------------------------------------------------------------
# WHY THIS EXISTS — it became necessary, not optional
# ----------------------------------------------------------------------------
# The frozen SR-GNN probe scored 0.1340 against the ViT linear probe's 0.2529.
# The AdaBN cleft arm — re-estimating the 2 POST-backbone BatchNorms — came
# back at **0.0468**, worse than doing nothing, and outside both readings
# registered before it ran.
#
# The mechanism is partial adaptation: bn1 and bn2 were calibrated for cleft
# statistics while still receiving activations from 40 Xception BatchNorms
# calibrated for SCUT. A uniform mismatch became an internally inconsistent
# one, and shrinkage moved 0.2943 → 0.4221 as the head fitted harder to a
# disturbed representation.
#
# **That 0.087 swing is what makes this run necessary.** It measures the 40
# extraction-time layers as load-bearing rather than idle history. Until they
# are calibrated for cleft, the probe's 0.1340 cannot be attributed to
# SR-GNN's representation — and ViT carries no equivalent handicap, LayerNorm
# having no running statistics at all. Without this, the write-up would report
# that the documented remedy was applied to 2 of 42 layers and made things
# worse, which is a fact about the experiment rather than about the
# architecture.
#
# ----------------------------------------------------------------------------
# WHY FIVE SETS — THE LEAK IS THE THING TO GET RIGHT
# ----------------------------------------------------------------------------
# Re-estimating BatchNorm on cleft data makes every feature vector depend on
# WHICH patients were adapted on. Do it once over all 237 and each fold's test
# patients sit inside the representation used to predict them: the arm scores
# better, the shapes are all correct, the hash is valid, every gate passes,
# and nothing downstream can see it.
#
# So `per_fold_bn_reestimation: true` produces **one set per fold**, each
# adapted on that fold's TRAINING patients only, named `..._adabn_fold<N>`.
# Each records `adapted_on_patient_ids`, and the exclusion is asserted twice —
# here at build time, and again in the consuming arm, which is the run that
# reports the number.
#
# **Adapted on the OUTER training fold, not the inner.** `inner_val_split`
# seeds off `config.seed`, so inner-train rows would make the artifact
# seed-dependent — fifty sets for a ten-seed band, a different representation
# per arm. The outer fold is seed-independent, which is what lets one artifact
# serve every seed. The stated cost: inner-val patients contribute to the
# statistics, so the early-stopping signal is mildly optimistic. That is NOT a
# leak into the reported metric, which is built from test folds only.
#
# ----------------------------------------------------------------------------
# COST
# ----------------------------------------------------------------------------
# Five extraction passes over 237 images plus five adaptation passes over ~190
# — about five times one extraction, which was minutes. The artifact is
# 5 × 95,136,804 bytes ≈ 476 MB.
#
# ----------------------------------------------------------------------------
# WHAT TO RUN AFTERWARDS — read configs/p6_srgnn_probe_adabn_artifact.yaml
# ----------------------------------------------------------------------------
# The 2×2 is the point: {40 SCUT, 40 cleft} × {2 SCUT, 2 cleft}. Two cells are
# measured (0.1340 and 0.0468). This artifact supplies the other two, and the
# FULLY CONSISTENT cell — 40 cleft + 2 cleft — is `trainable: classifier_adabn`
# on this artifact, not the plain probe.
#
#   bash -lc "cd /home/user/codex/cleft-aesthetics && PYTHONPATH=src \
#     python -m cleft.run --config configs/p6_extract_srgnn_adabn.yaml"

