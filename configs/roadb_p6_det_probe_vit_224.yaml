# THE DETERMINISM PROBE — ViT-224 FROM THE DECLARED INIT, FLAG ON. RUN TWICE.
#
# [MEASURED 2026-08-10] ViT pretraining is nondeterministic on the pinned
# stack from pinned weights on identical hardware — three runs, three
# checkpoints, spread 0.030, selected epochs 23/11/14
# (roadb.VIT_PRETRAINING_IS_NONDETERMINISTIC). The measured mechanism
# candidate: ViT's attention routes through fused scaled_dot_product_attention
# (fused_attn=True) where Swin's does not, and the fused backward is
# atomics-class; locally, forcing the MATH backend collapses the
# across-instance gradient divergence to bitwise zero.
#
# This config is the vit-224 cell with ONE field changed: deterministic: true
# — through the frozen determinism.configure, exactly the route the config
# comment reserved for it. TWO READABLE SURFACES, committed before the run:
#
#   it RAISES     -> the op names itself in the deterministic-mode error;
#   it RUNS       -> run it TWICE: the pair must be bitwise-equal
#                    (pretrained_checkpoint.sha256 identical), confirming
#                    the fused op by elimination.
#
# Same GPU MODEL both runs — the cross-device lesson. Deliberately NOT named
# roadb_p6_pretrain_* so the lattice's field-for-field test does not claim
# it: this probe intentionally differs from Road A in the deterministic
# field.
#
#   bash -lc "cd /home/user/codex/cleft-aesthetics && PYTHONPATH=src \
#     python -m cleft.run --config configs/roadb_p6_det_probe_vit_224.yaml"

