# PHASE 7B — THE PRE-REGISTERED SEARCH. ONE JOB, TWENTY-FOUR TRIALS.
#
# ----------------------------------------------------------------------------
# WHAT IS AND IS NOT IN THIS FILE
# ----------------------------------------------------------------------------
# The budget, the search space, the selection rule and the exhaustion
# criterion are NOT config fields. They live in `src/cleft/phase7b.py`, where
# `tests/test_phase7b.py` checks them — the space must enumerate to exactly the
# declared budget, the selection rule refuses a trial carrying any test-fold
# quantity, and the exhaustion threshold is derived from the baseline arm's own
# SD rather than written down.
#
# **A pre-registration a config could edit is not a pre-registration.** This
# file supplies only the DATA: which embedding sets the space reads, and the
# winner's seed list.
#
# ----------------------------------------------------------------------------
# ONE JOB, AND WHY
# ----------------------------------------------------------------------------
# The search is the artifact — brief §4, report the search, not the winner. One
# run directory holds one config, one env.json, one inputs.json and 24 trial
# records. Twenty-four directories would make "which twenty-four constituted
# the search" a join the reader performs, and that is exactly the join a
# twenty-fifth could slip through. The budget is enforceable in-process here:
# `configurations()` raises on a mismatch, so a single walk cannot exceed it.
#
# **Checkpointed per trial** into `trials.json`, and resumed from it. PLAN §2.7:
# run identity survives a pause and TRAINING DOES NOT — the pod reattaches the
# directory and restarts at zero with no symptom but wall time.
#
# ----------------------------------------------------------------------------
# THE OUT-OF-FOLD DISCIPLINE
# ----------------------------------------------------------------------------
# Each trial reports inner-validation ONLY, and no out-of-fold prediction is
# computed for it at all. The OOF number exists once, for the configuration
# selection already chose. A score that is never computed cannot be ranked on,
# which is a stronger guarantee than one computed and refused.
#
# ----------------------------------------------------------------------------
# TWO DECLARED DIVERGENCES FROM THE LADDER — see phase7b.BASELINE
# ----------------------------------------------------------------------------
# 1. **monitor** — this phase monitors and selects on `inner_val_pcc`; every
#    ladder arm early-stops on `inner_val_mse`. PCC is the primary metric and
#    this phase's output is a PCC comparison.
# 2. **head_fit_procedure** — every trial fits in closed form, because
#    `harness.run_fold` computes the held-out fold's predictions as part of its
#    job. **The winning configuration must be re-run through `train_cv` before
#    its number is quoted against the ladder's 0.2520.**
#
# Both are registered in `BASELINE['also_varies']` with licences, on
# `ladder.LICENCES`' rule: a second factor is a recorded design decision or it
# is a defect.
#
# ----------------------------------------------------------------------------
# STATE
# ----------------------------------------------------------------------------
# **[VERIFIED 2026-08-02] All fourteen embedding sets are declared.** The
# twelve pooling rollups came from `p7b_extract_blocks.yaml`, whose
# reproduction check passed bit-identical at block 12 with the class token —
# so the eleven depths that have no reference rest on an agreement that held
# exactly.
#
# **[VERIFIED 2026-08-02] Every input is declared — nothing is pending.** The
# five per-seed baseline vectors are 5,644 bytes each, consistent with 237
# rows apiece, which is the shape exit criterion 4's paired BCa needs on the
# baseline side.
#
# `phase7b.verify_available` independently refuses the search unless every
# configuration can run — running 12 of 24 would break the budget and the
# exhaustion window together.
#
#   bash -lc "cd /home/user/codex/cleft-aesthetics && PYTHONPATH=src \
#     python -m cleft.run --config configs/p7b_search.yaml"

