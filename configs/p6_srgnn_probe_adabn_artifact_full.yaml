# PHASE 6 — THE FULLY CONSISTENT ARM. Cell D of the 2x2. THE PRIMARY READ.
#
# ----------------------------------------------------------------------------
# THE 2x2, AND WHY THIS CELL IS NOT THE CLEAN ONE
# ----------------------------------------------------------------------------
# Two normalisation halves, independently settable:
#
#                        | bn1/bn2 SCUT        | bn1/bn2 cleft
#   ---------------------+---------------------+----------------------------
#   40 backbone BN SCUT  | A  0.1340 MEASURED  | B  0.0468 MEASURED
#   40 backbone BN cleft | C  THIS CONFIG      | D  p6_srgnn_probe_adabn_
#
# A is uniform (everything SCUT). B is partially adapted and scored WORSE by
# 0.087 — the measurement that forced the re-extraction.
#
# **C is the other partial cell.** 40 layers calibrated for cleft feeding 2
# still calibrated for SCUT: internally inconsistent in the opposite direction
# to B. By B's own mechanism it is NOT expected to be the clean comparison,
# and it is included because it isolates the two halves — without it, a good
# result at D could not be attributed between the 40 and the 2.
#
# **D is the fully consistent arm** and is the one to read against 0.2529.
#
# ----------------------------------------------------------------------------
# READ THE OUTCOMES — STATED BEFORE EITHER RUNS
# ----------------------------------------------------------------------------
# For D (the clean cell):
#   ~0.25   the whole gap was normalisation; SR-GNN's representation is fine.
#   ~0.134  the architecture reading is ESTABLISHED — every layer of the
#           normalisation chain has now been calibrated for cleft, so no
#           statistics alternative remains.
#   else    a mechanism nobody has named, and it is recorded as that rather
#           than assigned to the nearer reading. B is the precedent: the
#           pre-registered pair can be missed, and being able to say so is
#           the whole value of registering it.
#
# For C: if B's mechanism is right, C should also be depressed relative to D.
# C above D would mean the partial-adaptation account is wrong, which is worth
# knowing and is why C is run rather than assumed.
#
# **Neither is quotable as a value.** One seed against a regime SD of 0.025.
#
# ----------------------------------------------------------------------------
# HASHES ARE PLACEHOLDERS UNTIL THE RE-EXTRACTION RUNS
# ----------------------------------------------------------------------------
# The five per-fold sets do not exist yet. The rollups below are all-zeros and
# **guard 3 will refuse this run** until they are filled from
# `scripts/declare_inputs.py` — which is the placeholder working, exactly as it
# did for the seed band. Fill them after p6_extract_srgnn_adabn.yaml completes.
# A test asserts they are still zeros, and must be INVERTED when they are
# filled: a placeholder assertion is correct exactly once.
#
#   bash -lc "cd /home/user/codex/cleft-aesthetics && PYTHONPATH=src \
#     python -m cleft.run --config configs/p6_srgnn_probe_adabn_artifact_full.yaml"

