# PHASE 6 — SCUT PRETRAINING: ViT-B/16 ON MASKED SCUT, G2 (unwarp-to-square).
#
# One of THIRTY pretraining configs (transformers 2x3 at region_scheme none,
# graph backbones 2x4x3). Differs from its lattice neighbours in EXACTLY ONE
# task field; every non-axis value is identical across all thirty, asserted by
# tests/test_pretrain.py. The shared reasoning lives in
# p6_pretrain_vit_b16_original.yaml.
#
# READ p6_pretrain_vit_b16_masked_g1.yaml for the masked-specific reasoning:
# same labels, same split, only the pixels differ; correlation is compared
# against THIS backbone's original run, never the published band.
#
# The masked artifact input carries the rollup from p5-masked-scut-3's
# metrics.json (artifact.rollup_sha256_for_configs) -- the build's own record.

schema_version: 1
phase: p6
tier: keeper
seed: 1337

inputs:
  - name: scut_root
    path: ${CLEFT_SCUT_ROOT}
    rollup_sha256: 1041ceed0ef458e97c8be845eda30cf7957067fa730a4975a0f83bd8ed4947ec

  # Referenced by this NAME from the task, by convention -- see
  # p6_pretrain_vit_b16_masked_g1.yaml.
  - name: masked_scut
    path: /home/user/codex/cleft-aesthetics/data/scut/masked_v1
    # [MEASURED 2026-07-31] artifact.rollup_sha256_for_configs from run
    # p5-masked-scut-3 -- the artifact build's own metrics.json (5,499
    # faces, both geometries, 1.66 GB). Guard 3 verifies it at launch.
    rollup_sha256: 7c08f8657afeeb49fd34377fba9cd20241b2359a208d418a1dfa6399dc43708b

task:
  kind: pretrain

  scut_root: scut_root

  backbone: vit_b16
  source: masked_g2
  # Transformers have no region structure; the scheme axis is the
  # graph backbones' [DECIDED 2026-07-31]. The loop refuses any
  # other value here -- a knob that cannot act records an arm that
  # never ran.
  region_scheme: none

  expect_train: 3300
  expect_test: 2199

  # [DECIDED 2026-07-31] FIXED 30-epoch budget, best-checkpoint selection by
  # inner_val_pcc -- NO early stopping, and deliberately no patience field.
  # The four SR-GNN scheme originals showed patience terminating on noise in
  # a flat MSE region (anatomy epochs 5 vs 7: 2.3e-5 apart): run length
  # tracked luck, not scheme, and none of the eight pre-policy runs had
  # converged -- inner-val PCC was still climbing at every stopping point.
  # The replay over all eight curves showed a monitor switch only moves where
  # the noise bites. A fixed budget makes the arms comparable BY CONSTRUCTION
  # and the cost knowable in advance; those eight runs are SUPERSEDED (kept,
  # not deleted -- their curves are the evidence for this decision).
  #
  # This does NOT contradict Phase 3 gate 4: the void ladder's fixed budget
  # measured post-collapse endpoints on 152 cleft samples (peaks at epochs
  # 2-11, decay to ~0 in 20/20 fold-runs); on SCUT's 3,300 there is no
  # collapse -- PCC climbs monotonically in all eight curves. Early stopping
  # STAYS for the cleft ladder, where collapse is the documented behaviour.
  # N=30 covers every observed run except SR-GNN original's 34, and PCC has
  # largely plateaued by then. Selection on inner_val_pcc matches the primary
  # metric; legitimate because inner-val is carved from the TRAIN side and
  # the test set is disjoint, touched once.
  epochs: 30
  inner_val_frac: 0.1
  monitor: inner_val_pcc

  # [DECIDED 2026-07-31, from image measurements] FALSE, and settled: flag-off
  # in the image, vit_b16/swin_b/srgnn are BITWISE (repeat-grad and post-
  # restore step 0.0) so the flag buys them nothing -- and it CANNOT fix
  # agnet there: the deterministic roi_align substitution needs
  # torch.compile -> inductor -> a C++ compiler the image does not have
  # (InvalidCxxCompiler, measured). AG-Net's recorded property instead:
  # deterministic to ~2.3e-05 (post-restore 2.26e-05 image / 2.31e-05 local),
  # its resume check is a tolerance, and any AG-Net delta needs its own seed
  # band measured under that condition. models/{agnet,srgnn}.py
  # TRAINING_DETERMINISM carry the full record; if this is ever set true, the
  # loop routes through the frozen determinism.configure (CUBLAS workspace).
  deterministic: false

  learning_rate: 0.0001
  weight_decay: 0.01
  batch_size: 32

  checkpoint_every: 1
