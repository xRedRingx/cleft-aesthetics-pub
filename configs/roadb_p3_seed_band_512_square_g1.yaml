# ROAD B PHASE 3 — 512 SQUARE G1: THE RUN THAT DECIDES THE AXIS'S SHAPE
#
# This was going to confirm the band (SEED_BAND_RESOLVED: one planning band,
# 0.016739, per the pre-registered rule). It still does -- but 768 scored
# 0.0898 against 224's 0.2319, so this run now also decides the shape of the
# resolution axis (roadb.RESOLUTION_DROP_PENDING_VERIFICATION):
#
#   * 512 near 224      -> the curve is flat, then collapses at 768;
#   * 512 in between    -> the decline is monotone and the axis trends DOWN.
#
# Either way, the opposite of what Branch 1 predicted. The 768 observation is
# NOT a finding until its extraction report is verified (input_size,
# dynamic_input, embedding_dim) -- read this run's report the same way before
# reading its mean.
#
# **Road A's ten seeds**, so per-seed values pair across the whole series:
# 224 (gate 2), 512, 768 share their inner-val splits seed for seed.
#
# batch_size serves extraction AND head training; if extraction OOMs at a
# GPU fraction, raise the fraction rather than lowering the field.
#
#   bash -lc "cd /home/user/codex/cleft-aesthetics && PYTHONPATH=src \
#     python -m cleft.run --config configs/roadb_p3_seed_band_512_square_g1.yaml"

