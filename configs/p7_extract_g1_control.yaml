# PHASE 7 — THE ONE EXTRACTION STAGE C0 NEEDS.
#
# ----------------------------------------------------------------------------
# WHY ONE SET, AND WHY IT DOES NOT EXIST YET
# ----------------------------------------------------------------------------
# `embedding_plan` derives G1 sets only for Stage C's masked cells, because the
# ladder runs at G2 and Stage C was the only G1 question. Stage C0 asks a
# different one and needs `vit_b16__scut_original__g1`.
#
# **Stage C's cells consume DIFFERENT checkpoints.** Masked inits are
# geometry-bound (`embeddings.check_init_geometry`), so its G1 cell takes
# masked_g1 and its G2 cell takes masked_g2 — two checkpoints with measured
# pretraining quality 0.7893 and 0.8306. Stage C therefore measures a matched
# PIPELINE, not geometry, and cannot test the tiling prediction or separate a
# geometry×init interaction from masked_g1 simply being the weakest checkpoint
# of the twelve.
#
# **`scut_original` is NOT geometry-bound.** One `original` checkpoint serves
# both geometries, so `vit_b16 scut_original g1` against the existing
# `g2` arm varies geometry ALONE on pretrained weights. Together with the
# ImageNet pair (0.2521 G1 against 0.1347 G2, same weights both sides) that
# says whether the pure-geometry effect depends on the init.
#
# ----------------------------------------------------------------------------
# A NEW VERSION, NOT AN ADDITION
# ----------------------------------------------------------------------------
# `data/embeddings/embeddings_v1` is published and immutable (PLAN §2.6), so
# this cannot be dropped into it. It extracts into its own version holding
# exactly one set — small, and its rollup is declared by exactly one config.
#
# `per_fold_bn_reestimation` is OFF: this is a transformer, its normalisation
# is LayerNorm, and there are no running statistics to re-estimate. The
# per-fold machinery exists for the graph backbones.
#
# ----------------------------------------------------------------------------
# AFTERWARDS
# ----------------------------------------------------------------------------
# Run `scripts/declare_ladder_inputs.py`, paste the one new rollup into
# `ladder.DECLARED_EMBEDDING_HASHES`, and regenerate with
# `scripts/generate_ladder_configs.py`. Until then guard 3 refuses
# `p7_c0_vit_b16_scut_original_g1`, which is the placeholder working.
#
#   bash -lc "cd /home/user/codex/cleft-aesthetics && PYTHONPATH=src \
#     python -m cleft.run --config configs/p7_extract_g1_control.yaml"

