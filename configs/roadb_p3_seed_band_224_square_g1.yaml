# ROAD B PHASE 3 — THE 224 REPLICATE: ROAD A'S ARTIFACT, A DISJOINT TEN SEEDS
#
# The 224 end of the axis already has a band -- Road A's gate 2, SD 0.0137 on
# this same artifact with this same procedure. **Re-running Road A's seeds
# here would reproduce it bit-for-bit (determinism) and measure nothing.**
#
# This disjoint draw buys two things in one run (roadb.SEED_BAND_DESIGN):
#
#   * a second, INDEPENDENT estimate of the same band -- the empirical noise
#     floor for the agreement test. Two ten-seed SDs of one procedure can
#     differ by ~1.4x on sampling noise alone (F(9,9)); seeing that on real
#     data is what stops a 1.4x "divergence" at 768 being over-read;
#   * the apparatus check: Road B's sweep machinery reproducing the gate-2
#     regime on the gate-2 artifact, before the 768 number is trusted.
#
# The decision rule is PRE-REGISTERED in roadb.SEED_BAND_DESIGN -- read it
# before reading either sweep's numbers.
#
#   bash -lc "cd /home/user/codex/cleft-aesthetics && PYTHONPATH=src \
#     python -m cleft.run --config configs/roadb_p3_seed_band_224_square_g1.yaml"

