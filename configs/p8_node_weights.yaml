#
# GENERATED by scripts/generate_phase8_configs.py from cleft.phase8
# and p7_d1_srgnn_imagenet_g1_native.yaml. The hyperparameters are COPIED from arm B,
# not retyped: this run refits arm B's fifty models and gates on
# reproducing 0.1719, and a mistyped learning rate
# would fail that gate after ten seeds of fitting.
#
# **GATE 1 — the refit must BE arm B.** Pooled mean over
# 10 seeds within 0.002 of
# 0.1719, or these are not arm B's models and every
# weight would describe a different one. Nothing is read.
#
# **GATE 2 — the randomisation test.** Node weights are an
# EXPLANATION, so Adebayo's sanity check applies to them: an ungated
# graph explanation beside a gated transformer one is the asymmetry
# the both-families comparison exists to avoid. The criterion is the
# phase-level separability interval; per-patient figures are
# PERCENTILES and decide nothing (phase8.RANDOMISATION_CRITERION_ADOPTED).
#
# **TWO MODES, RANDOMISED BY TWO DIFFERENT ROUTES.**
# explanation_source walks the trained graph layers at cleft time --
# the parameters that actually produce region_w.
# component_role CANNOT be a parameter walk here:
# randomising all 20,806,952 backbone
# parameters at cleft time leaves region_w BITWISE identical, because
# the artifact-fed path enters below the backbone and the frozen
# representation is an INPUT here rather than a computation. It would
# have reported similarity 1.0 and the gate would have read that as
# the explanation SURVIVING randomisation -- the worst verdict, from a
# test that changed nothing. So it runs off the CONTROL SET instead:
# 'randomised_embeddings', the same map re-extracted from a randomised
# backbone (configs/p8_randomised_extract.yaml). Without that input
# declared the mode does not run and the A<->B comparison is reported
# UNAVAILABLE -- which is not the same as unresolved.
# phase8.COMPONENT_ROLE_IS_A_NO_OP,
# phase8.COMPONENT_ROLE_CONTROL_IS_A_REEXTRACTION.
#
# **[MEASURED] THE CONTROL MAY COLLAPSE, AND THE READING IS ALREADY
# REGISTERED.** The randomised backbone ignores its input (maps differ
# between patients by 5.96e-08 against a real 4.96), and with an
# UNTRAINED head that drives the 26 region weights to exactly uniform.
# gradcam.similarity returns 0.0 for a vector with no rank structure,
# so a collapse would read as 0.0 for all 237 -- below any baseline,
# gate resolves, spectacular pass, measuring nothing. Whether arm B's
# TRAINED attention keeps rank structure cannot be known before this
# runs. node_weights.degeneracy checks it, all three readings are
# registered in advance, and the verdict travels inside the gate.
#
# 27 NODES, 26 RANKED. The whole
# feature map is appended as the last node before attention, so one
# entry is not a region at all. It is split off and reported
# separately: a shared near-constant element inflates the
# between-patient baseline, and that baseline is the bar a randomised
# vector must fall BELOW.
#
# TWO SAMPLES, TWO QUESTIONS: the arm's own gate on all
# 237 patients (27,966 baseline pairs), the
# A<->B-scoped figures on the shared 15. If the interval does not resolve
# it is reported UNRESOLVED, not rescued by quoting the other sample
# or by switching statistic afterwards.
#
# Each patient is explained by the fold-model that HELD THEM OUT, at
# every seed, with per-seed agreement reported rather than averaged
# away. phase8.SRGNN_NODE_WEIGHTS_R10_READ.
#
# **randomised_embeddings's rollup is the declare pass's own figure** --
# filled 2026-08-14 after configs/p8_randomised_extract.yaml
